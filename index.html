<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">

  <div id="welcomeBox">
    <div class="icon">👋</div>
    <h1>أهلاً بيك!</h1>
    <p>اكتب اسمك عشان نبدأ يومك</p>
    <input id="nameInput" placeholder="✍️ اسمك هنا...">
    <button id="saveNameBtn" class="main-btn">دخول 🚀</button>
  </div>

  <div id="mainApp" hidden>
    <div class="top">
      <h1>✨ Life Tracker</h1>
      <button id="themeBtn">🌙</button>
    </div>
    <p id="greeting"></p>

    <div class="progress"><div id="bar"></div></div>
    <p id="counter"></p>
<div class="pomodoro">
  <h3 id="pomoMode">📚 وقت مذاكرة</h3>
  <div id="pomoTime">25:00</div>
  <button id="pomoStart">▶️ ابدأ</button>
  <button id="pomoReset">🔄 من الأول</button>
</div>
    <input id="taskInput" placeholder="✍️ اسم المهمة">
    <select id="catInput">
      <option value="📚">📚 مذاكرة</option>
      <option value="💪">💪 رياضة</option>
      <option value="💻">💻 برمجة</option>
      <option value="🎬">🎬 ترفيه</option>
      <option value="📌">📌 أخرى</option>
    </select>
    <select id="dayInput">
      <option value="0">السبت</option>
      <option value="1">الأحد</option>
      <option value="2">الاثنين</option>
      <option value="3">الثلاثاء</option>
      <option value="4">الأربعاء</option>
      <option value="5">الخميس</option>
      <option value="6">الجمعة</option>
    </select>
    <input id="timeInput" type="time">
    <button id="addBtn" class="main-btn">➕ إضافة مهمة</button>
<div class="filters">
  <button class="filterBtn active" data-filter="all">الكل</button>
  <button class="filterBtn" data-filter="active">المتبقي</button>
  <button class="filterBtn" data-filter="done">المنتهي</button>
</div>
    <ul id="taskList"></ul>
    <button id="clearBtn">🗑️ امسح الكل</button>
  </div>

</div>
<script src="script.js"></script>
</body>
      </html>
